name: Nuget

on:
  push:
    branches: [ "master" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
    
env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1

jobs:
  nuget-publish:
    name: Package Commit
    runs-on: ubuntu-latest
    # Trusted publishing: NuGet/login trades the job's OIDC token for a short-lived API key, so there's no key to
    # store or rotate. It needs a nuget.org trusted publishing policy for this repository and workflow file.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            8.0.x
            7.0.x
      - name: Pack
        run: |
          dotnet build -c Release
          dotnet pack -c Release -o build --no-build
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push
        # Through the environment rather than expanded into the script, which the shell would parse.
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "build/*" --skip-duplicate -k "$NUGET_API_KEY" \
            -s https://api.nuget.org/v3/index.json
